server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/suggestion;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/json application/javascript text/xml application/xml;

    # 安装包：支持断点续传，手机下载中途断了能接着下
    # 默认类型是 application/octet-stream，浏览器会当“未知文件”存成 .bin，
    # 声明成安卓安装包类型以后，手机下载器才会按 apk 处理
    location /apk/ {
        default_type application/vnd.android.package-archive;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    # 账号服务：转给本机 3001 的公共账号服务（deploy/accounts/server.js）
    # 以后别的软件也连这个地址，共用同一批账号
    location /accounts/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        client_max_body_size 64k;
    }

    # 版本清单：每次刷新都要拿到最新的，别缓存
    location = /versions.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # 后端接口：转给本机 3000 的 Node 服务（deploy/server/server.js）
    # 注意 proxy_pass 后面不带路径，原样把 /api/... 传过去
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/suggestion.access.log;
    error_log  /var/log/nginx/suggestion.error.log;
}
