server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/suggestion;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/json application/javascript text/xml application/xml;

    # 安装包：支持断点续传，手机下载中途断了能接着下
    location /apk/ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    # 版本清单：每次刷新都要拿到最新的，别缓存
    location = /versions.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/suggestion.access.log;
    error_log  /var/log/nginx/suggestion.error.log;
}
